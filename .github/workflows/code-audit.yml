name: AI Code Audit

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # 同一 PR 若連續推送新 commit，取消前一次還在跑的檢核，避免浪費 API 額度
  group: ai-code-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: 判斷是否需要檢核
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      should-run: ${{ steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: 檢查變更檔案類型
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.scss'
              - '**/*.css'
              - 'package.json'
              - 'package-lock.json'
          # 只有 .md、.txt、圖片等純文件變更時，should-run 會是 false，跳過後續所有檢核，節省成本

  static-checks:
    name: Lint / TypeCheck / Style / Dependency Audit
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should-run == 'true'
    outputs:
      lint-summary: ${{ steps.lint.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint（含 react-hooks 規則）
        id: lint
        run: |
          npx eslint . --ext .ts,.tsx,.js,.jsx --format json --output-file eslint-report.json || true
          COUNT=$(jq '[.[] | .messages[]] | length' eslint-report.json)
          echo "summary=${COUNT} 個問題" >> "$GITHUB_OUTPUT"

      - name: TypeScript 型別檢查
        run: npx tsc --noEmit

      - name: Stylelint（SCSS/CSS）
        run: npx stylelint "**/*.scss" "**/*.css" --formatter json --output-file stylelint-report.json || true

      - name: npm audit（依賴套件漏洞掃描）
        run: npm audit --audit-level=moderate --json > npm-audit-report.json || true

      - name: 上傳靜態檢查報告
        uses: actions/upload-artifact@v4
        with:
          name: static-check-reports
          path: |
            eslint-report.json
            stylelint-report.json
            npm-audit-report.json

  baseline-diff:
    name: 建立 Baseline（排除舊有問題）
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should-run == 'true'
    steps:
      - name: Checkout（含完整歷史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 針對 base branch 跑一次 ESLint，作為 baseline
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          npx eslint . --ext .ts,.tsx,.js,.jsx --format json --output-file baseline-eslint-report.json || true
          git checkout ${{ github.event.pull_request.head.sha }}
          # baseline 只用來讓 AI 判斷「這個問題是不是 PR 新增的」，
          # 實際比對交給 AI 語意判斷，因為單純比對行號在程式碼有位移時會失準

      - name: 上傳 baseline 報告
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          path: baseline-eslint-report.json

  ai-semantic-review:
    name: Antigravity 語意層檢核
    runs-on: ubuntu-latest
    needs: [static-checks, baseline-diff]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下載靜態檢查報告
        uses: actions/download-artifact@v4
        with:
          name: static-check-reports

      - name: 下載 baseline 報告
        uses: actions/download-artifact@v4
        with:
          name: baseline-report

      - name: 安裝 Antigravity CLI
        run: npm install -g @google/antigravity-cli

      - name: 產生 diff 檔案
        run: |
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr.diff

      - name: 撰寫結構化檢核 prompt
        # prompt 內容獨立成 .github/scripts/build-prompt.sh 維護，
        # 內含 XML 標籤分隔不可信輸入、JSON schema、few-shot 範例
        run: bash .github/scripts/build-prompt.sh

      - name: 執行語意層程式碼檢核（輸出結構化 JSON）
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
        run: |
          antigravity run --prompt-file prompt.txt --output review.json

      - name: 將 JSON 轉換為 PR 留言 markdown
        # AI 輸出穩定的 JSON，這支腳本只負責呈現；
        # 若 JSON 解析失敗會產生保底留言，不會讓整個 workflow 失敗
        run: node .github/scripts/render-comment.js

      - name: 將檢核結果貼到 PR 留言
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: 上傳完整檢核報告（JSON 原始輸出）
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: |
            review.json
            review-comment.md